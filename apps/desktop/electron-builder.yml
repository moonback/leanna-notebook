appId: fr.moonback.leannanotebook
productName: Leanna Notebook
executableName: LeannaNotebook
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - build/icon.png
  - "!**/*.map"
asar: true
compression: maximum
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Leanna-Notebook-Setup-${version}-${arch}.${ext}
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  shortcutName: Leanna Notebook
  uninstallDisplayName: Leanna Notebook
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerLanguages:
    - fr_FR

publish:
  provider: github
  owner: moonback
  repo: leanna-notebook
  releaseType: release
